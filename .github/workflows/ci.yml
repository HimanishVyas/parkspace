name: CI

on:
  push:
    branches: [main]
  pull_request:

# A run already in flight for the same branch is not worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parking
          POSTGRES_PASSWORD: parking
          POSTGRES_DB: parking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parking"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Tests
        working-directory: backend
        env:
          TEST_DB_NAME: parking_test
          TEST_DATABASE_URL: postgresql+asyncpg://parking:parking@localhost:5432/parking_test
        run: pytest -q

  # The suite builds its schema with Base.metadata.create_all, so nothing else
  # ever runs the migrations. Without this job a migration could be missing or
  # wrong and every test would still pass.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parking
          POSTGRES_PASSWORD: parking
          POSTGRES_DB: parking_migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parking"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://parking:parking@localhost:5432/parking_migrations
      ENVIRONMENT: test
      JWT_SECRET: ci-only-secret-long-enough-for-hs256-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Enable btree_gist
        run: |
          PGPASSWORD=parking psql -h localhost -U parking -d parking_migrations \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gist"

      - name: Migrate up from empty
        working-directory: backend
        run: alembic upgrade head

      - name: Models and migrations agree
        working-directory: backend
        # An empty autogenerate diff is the whole point: if a model changed
        # without a migration, this produces one and the check fails.
        run: |
          alembic revision --autogenerate -m drift-check >/dev/null
          generated=$(ls -t alembic/versions/*drift_check.py | head -1)
          if grep -qE "op\.(add|drop|alter|create)_" "$generated"; then
            echo "::error::models have drifted from migrations:"
            cat "$generated"
            exit 1
          fi
          echo "no drift"
          rm -f "$generated"

      - name: Migrate back down
        working-directory: backend
        run: alembic downgrade base

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Node dependencies
        working-directory: frontend
        # Fails on moderate and above. The last sweep found a critical XSS
        # sanitizer bypass in maplibre-gl and an open redirect in react-router,
        # both of which had been sitting in the lockfile for months.
        run: |
          npm ci
          npm audit --audit-level=moderate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime images
        run: |
          docker build -t parkspace-api ./backend
          docker build -t parkspace-web ./frontend

      - name: The runtime image must not ship test tooling
        run: |
          if docker run --rm parkspace-api python -c "import pytest" 2>/dev/null; then
            echo "::error::pytest is present in the production image"
            exit 1
          fi
          echo "runtime image is clean"

      - name: A production process must refuse insecure configuration
        run: |
          if docker run --rm -e ENVIRONMENT=production \
               -e DATABASE_URL=postgresql+asyncpg://x:x@localhost/x \
               parkspace-api python -c "import app.main" 2>/dev/null; then
            echo "::error::the app booted in production with shipped defaults"
            exit 1
          fi
          echo "insecure production boot refused"
