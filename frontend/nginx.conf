# Security headers applied to every response this server sends.
#
# These matter more here than they would in most apps, because the session lives
# in localStorage rather than an HttpOnly cookie: anything that manages to run
# script on this origin can read a 30-day refresh token. The CSP is the control
# that stops that, and `frame-ancestors` keeps the app out of somebody else's
# iframe.
#
# connect-src stays 'self' because the API is proxied under /api on this origin.
# The two font hosts and the map tile/style sources are the only third parties
# the app talks to; add nothing here without knowing why.
map $sent_http_content_type $csp {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https://*.maptiler.com https://*.tile.openstreetmap.org; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://*.maptiler.com https://*.tile.openstreetmap.org; upgrade-insecure-requests";
}

# TLS is terminated upstream (load balancer / Cloudflare / ingress), so this
# server speaks plain HTTP on the internal network only. Two things still have
# to happen here, because the edge cannot do them for us:
#
#   - HSTS, which must be sent on the response the browser actually receives;
#   - a redirect for any request that reached the edge over http, which we can
#     only detect from X-Forwarded-Proto.
#
# The proto to hand the API. Falls back to $scheme when no proxy set the
# header, which is the local-development case.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Only send HSTS once we know the browser really did reach the edge over https.
# Keyed off the header itself, never off $scheme: nginx always sees http here,
# so $scheme would mean HSTS was never sent at all.
map $http_x_forwarded_proto $hsts {
    default "";
    "https" "max-age=31536000; includeSubDomains";
}

# Redirect only on an explicit "http" from the proxy. Keying this off
# $forwarded_proto instead meant a request with no header at all -- local
# development, and every internal health probe -- fell back to $scheme, which is
# always http here, and nginx redirected every single request including the API.
map $http_x_forwarded_proto $edge_was_plaintext {
    default 0;
    "http"  1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Probed by the load balancer over plain http from inside the network.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change; the shell must not be cached.
    location /assets/ {
        expires 1y;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # The API and uploaded media are served from the same origin as the app,
    # so the browser never makes a cross-origin request.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 8m;
    }

    # Uploaded files, served from the app's own origin. Upload validation checks
    # magic bytes, which a file that is a valid JPEG *and* valid HTML passes — so
    # the defence is refusing to let the browser treat any of it as a document:
    # never sniff, always download, and a sandboxed CSP for anything that is
    # opened anyway.
    location /media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Client-side routing: unknown paths fall through to the app shell.
    location / {
        # Documents only. The edge normally does this itself; this is the
        # backstop for an edge that forwards plaintext instead of redirecting.
        # Deliberately not applied to /api/, /media/, /assets/ or /healthz: a
        # 301 on an API POST would silently drop the request body.
        if ($edge_was_plaintext) {
            return 301 https://$host$request_uri;
        }
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
