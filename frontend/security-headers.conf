# Included into every location block on purpose.
#
# nginx's add_header does not merge: a location that sets any header of its own
# discards every add_header inherited from the server block. Listing them once
# here and including the file everywhere is what keeps a location from quietly
# serving without a CSP.
add_header Strict-Transport-Security $hsts always;
add_header Content-Security-Policy $csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
